    <title>Peter Hoff Design — Jewellery Configurator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@200;300;400&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                primary:   'var(--brand-primary)',
                secondary: 'var(--brand-secondary)',
                bg:        'var(--brand-bg)',
                text:      'var(--brand-text)',
              }
            }
          }
        }
      }
    </script>
    <style>
      :root {
        --brand-primary:   #3b82f6;
        --brand-secondary: #1e40af;
        --brand-bg:        #f3f4f6;
        --brand-text:      #111827;
      }
      *, *::before, *::after { box-sizing: border-box; }
      body { margin: 0; overflow: hidden; }
    </style>
    <script type="module" crossorigin src="/jewelry/assets/index-C9zqf-0H.js"></script>
